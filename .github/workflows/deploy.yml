name: Deploy React Tetris to GitHub Pages

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境 (使用兼容版本 16)
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: 安装依赖并打包
        run: |
          npm install --legacy-peer-deps
          npm run build
        env:
          PUBLIC_URL: ./
          NODE_OPTIONS: --openssl-legacy-provider

      - name: 部署到 gh-pages 分支
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
